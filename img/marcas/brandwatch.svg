<!--
  Marca de Brandwatch, solo el hexágono (sin el texto).

  De dónde sale: el logotipo oficial publicado en brandwatch.com.
  Se extrajeron los seis trazos de color del símbolo y se dejó
  fuera el resto. No lleva scripts ni referencias externas: es
  geometría y nada más.

  Por qué está aquí: identifica una certificación que Álvaro
  obtuvo de verdad. Es uso nominativo de una marca ajena —la
  misma función que cumple en un perfil de LinkedIn—, no una
  apropiación. Brandwatch conserva todos sus derechos sobre ella.

  La lámina del certificado que hay en el repositorio Images está
  recortada por la izquierda y el hexágono sale partido, así que
  no servía para recortarlo de ahí como se hizo con los otros tres.
-->
